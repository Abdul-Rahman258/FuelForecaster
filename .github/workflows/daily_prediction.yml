name: Daily OGRA Petrol Prediction (6:00 PM PKT)

on:
  schedule:
    # 6:00 PM PKT is 1:00 PM UTC (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  predict-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run Prediction Guardrails & Sanity Tests
        run: |
          python -m unittest ml/test_guardrails.py

      - name: Run Daily Prediction & Database Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ml/daily_cron.py --now
