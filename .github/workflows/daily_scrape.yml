name: Daily Price Scraper

on:
  schedule:
    # Runs at 02:00 AM PKT (which is 21:00 UTC) to account for late updates in Pakistan
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r ml/requirements.txt

      - name: Run Midnight Scraper & AI Model
        env:
          PYTHONPATH: .
        run: |
          python ml/live_updater.py
          python ml/generate_daily_predictions.py

      - name: Commit Updated Rates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ml/data/live_rates.json ml/data/predictions_cache.json
          git commit -m "Auto-update: Synchronized live petrol rates and ML predictions at midnight" || echo "No changes to commit"
          git push
